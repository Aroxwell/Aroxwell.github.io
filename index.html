    <script>
      document.getElementById("i9xpxk-2-2").addEventListener("submit", async function(event) {
        event.preventDefault();

        const form = event.target;
        const email = form.email.value;
        const button = form.querySelector("button");

        button.disabled = true;

        try {
          const response = await fetch("https://aroxwell-email.aroxwellbusiness.workers.dev", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email
            })
          });

          const result = await response.json();

          if (result.success) {
            form.reset();
            alert("You're in! Check your inbox for confirmation.");
          } else {
            alert(JSON.stringify(result));
          }

        } catch (error) {
          alert("Something went wrong. Please try again.");
        }

        button.disabled = false;
      });
    </script>
