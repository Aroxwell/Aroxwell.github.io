            </span><div data-type-role="flex-row" id="iherobtnrow-2-2" class="gjs-plg-flex-row"><div id="icuw4f-2-2" class="hero-form-wrap"><form id="i9xpxk-2-2" class="hero-form"><input type="email" name="email" placeholder="Enter your email address" autocomplete="email" aria-label="Email address" required id="isxk5f-2-2" class="hero-input"/><button type="submit" id="ini249-2-2" class="gjs-t-button hero-submit"><span id="ikjsyp">→</span></button></form><p id="ifqksh-2-2" class="hero-note">No spam. Unsubscribe anytime.</p></div></div><div id="ibdk5j-2-2" class="hero-divider"></div></div></div></div></section><script id="ic2m2o">
      document.getElementById("i9xpxk-2-2").addEventListener("submit", async function(event) {
        event.preventDefault();

        const form = event.target;
        const email = form.email.value;
        const button = form.querySelector("button");
        const note = document.getElementById("ifqksh-2-2");
        const defaultNote = "No spam. Unsubscribe anytime.";
        const successNote = "You're in - check your inbox for an email";

        button.disabled = true;
        button.classList.remove("is-success");
        button.classList.add("is-loading");
        note.classList.remove("is-success");
        note.textContent = defaultNote;

        try {
          const response = await fetch("https://aroxwell-email.aroxwellbusiness.workers.dev", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email
            })
          });

          const result = await response.json();

          if (result.emailOctopusStatus === 200) {
            form.reset();
            button.classList.remove("is-loading");
            button.classList.add("is-success");
            note.textContent = successNote;
            note.classList.add("is-success");
          } else {
            button.classList.remove("is-loading");
            alert(JSON.stringify(result));
          }

        } catch (error) {
          button.classList.remove("is-loading");
          alert("Something went wrong. Please try again.");
        }

        button.disabled = false;
      });
    </script></body>
